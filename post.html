<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting — gradomski.dev</title>
<meta name="description" content="Posts have moved to their own pages under /posts/. This page forwards the old ?slug= links.">
<!-- Posts used to be rendered here from Markdown at ?slug=…, which meant the
     page was empty for anything that does not run JavaScript. They are static
     pages under /posts/ now. This shim only exists to forward links that were
     shared or indexed before the move; it should never be indexed itself. -->
<meta name="robots" content="noindex, follow">
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch (e) {}

  // Slugs are filenames, so anything that is not a plain filename is not a post
  // we have — send those to the index rather than building a path out of them.
  (function forward() {
    const slug = new URLSearchParams(location.search).get("slug") || "";
    const safe = /^[a-z0-9-]+$/i.test(slug);
    location.replace(safe ? `posts/${slug}.html` : "blog.html");
  })();
</script>
</head>
<body data-page="post">

<main id="main">
  <section class="section">
    <div class="wrap wrap--narrow">
      <h1>This post has moved.</h1>
      <p class="lead">
        Posts now live at their own addresses under <code>/posts/</code>.
        <a href="blog.html">All posts</a> lists them.
      </p>
    </div>
  </section>
</main>

</body>
</html>
