.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;

  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}

.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}

.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

.iso{--al-accent:#f2a33a;--al-accent-soft:#f2a33a24;--al-accent-ink:#ffc874;--al-done:#7f8a99;--al-code-bg:#0f0f0f;--al-line:#ffffff10}
.iso[data-theme="light"]{--al-accent:#c27400;--al-accent-soft:#c274001c;--al-accent-ink:#8a5200;--al-done:#8b95a3;--al-code-bg:#f6f6f3;--al-line:#0000000c}
*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}

.al-hot>.iso-solid>.iso-edge,.al-hot .iso-solid>.iso-edge,.iso-solid.al-hot>.iso-edge{stroke:var(--al-accent)}
.al-hot .iso-solid>.iso-top,.iso-solid.al-hot>.iso-top{fill:color-mix(in srgb,var(--anatomy-top) 86%,var(--al-accent))}
.al-hot .al-digits,.al-hot .al-name{fill:var(--al-accent-ink)}
.al-hot .al-plate>.iso-edge{stroke:var(--al-accent)}
.iso-line[data-tone="accent"]{stroke:var(--al-accent)}
.al-dim .al-digits{fill:var(--anatomy-lo)}
.al-indices [data-out] text{fill:var(--anatomy-faint)}
.al-indices [data-done] text{fill:var(--al-done)}
.al-digits{font-weight:600;letter-spacing:0}
.al-bar>.iso-fill,.al-bar>.iso-shade,.al-bar>.iso-top{fill:var(--anatomy-strong)}
.al-bar.al-hot>.iso-fill,.al-bar.al-hot>.iso-shade,.al-bar.al-hot>.iso-top{fill:var(--al-accent)}
.al-name{font-weight:600;letter-spacing:.06em}
.al-window{fill:var(--al-code-bg);stroke:none}
.al-window-frame{fill:var(--anatomy-paper);stroke:var(--anatomy-mid);stroke-width:var(--anatomy-weight);vector-effect:non-scaling-stroke}
.al-window-split{stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);vector-effect:non-scaling-stroke}
.al-drum-digit{fill:var(--anatomy-hi);font-family:var(--anatomy-mono);font-weight:600}

/* Strona */
.al-page{width:min(1180px,100% - 32px);margin:40px auto 72px}
.al-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:18px}
.al-series{font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--anatomy-muted)}
.al-title{margin:2px 0 0;font-size:26px;line-height:1.2;font-weight:600;color:var(--anatomy-strong);letter-spacing:-.01em}
.al-toggles{display:flex;gap:6px;flex-wrap:wrap}
.al-seg{display:inline-flex;border:1px solid var(--anatomy-lo);border-radius:7px;overflow:hidden}
.al-seg button{background:none;border:0;padding:4px 10px;font-family:var(--anatomy-mono);font-size:12px;color:var(--anatomy-muted);cursor:pointer}
.al-seg button[aria-pressed="true"]{background:var(--anatomy-faint);color:var(--anatomy-strong)}
.al-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:20px;align-items:start}
.al-grid .iso-figure{margin:0}
.al-grid>*,.al-side,.al-panel{min-width:0}
.al-page .iso-stage,.al-page .iso-stage .iso-svg{overflow:hidden}
.al-side{display:grid;gap:14px}
.al-panel{background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-lo);padding:14px 16px}
.al-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--anatomy-muted)}
.al-code{margin:0;font-family:var(--anatomy-mono);font-size:13px;line-height:1.7;color:var(--anatomy-text);overflow-x:auto;background:none}
.al-line{display:block;padding:0 8px;border-left:2px solid transparent;white-space:pre}
.al-line[data-on]{background:var(--al-accent-soft);border-left-color:var(--al-accent);color:var(--anatomy-strong)}
.al-vars{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--anatomy-mono);font-size:14px;color:var(--anatomy-strong)}
.al-var b{font-weight:400;color:var(--anatomy-muted)}
.al-var[data-hot] {color:var(--al-accent-ink)}
.al-say{min-height:3.2em;font-size:16px;line-height:1.5;color:var(--anatomy-strong)}
.al-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:14px}
.al-btn{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:34px;padding:0 10px;border-radius:7px;border:1px solid var(--anatomy-lo);background:var(--anatomy-card);cursor:pointer;color:var(--anatomy-strong);font-size:13px}
.al-btn:hover{border-color:var(--anatomy-mid)}
.al-btn:focus-visible,.al-seg button:focus-visible,.al-scrub:focus-visible{outline:2px solid var(--al-accent);outline-offset:2px}
.al-btn[data-primary]{background:var(--al-accent);border-color:var(--al-accent);color:#111;font-weight:600;min-width:44px}
.al-scrub{flex:1 1 220px;accent-color:var(--al-accent)}
.al-time{font-family:var(--anatomy-mono);font-size:12px;color:var(--anatomy-muted);min-width:96px;text-align:right}
.al-own{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:13px}
.al-own input{background:var(--anatomy-card);border:1px solid var(--anatomy-lo);border-radius:6px;padding:5px 8px;font-family:var(--anatomy-mono);font-size:13px;min-width:0}
.al-own input[name="array"]{flex:1 1 200px}
.al-own input[name="target"]{width:70px}
.al-own [data-error]{color:var(--anatomy-red)}
.al-keys{font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-muted);letter-spacing:.04em}
.al-legend{margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.al-legend li{margin:2px 0}
.al-legend ul{margin:0;padding-left:18px}
@media (max-width:900px){.al-grid{grid-template-columns:1fr}.al-page{margin-top:24px}}
@media (max-width:560px){.al-title{font-size:21px}.al-time{display:none}}

/* Wideo: kadr o sta\u0142ym rozmiarze, bez kontrolek */
body[data-video]{overflow:hidden}
.al-video{position:relative;overflow:hidden;background:var(--anatomy-page)}
.al-video .al-stage-svg{position:absolute;overflow:hidden}
.al-video .iso-svg{width:100%;height:100%;overflow:hidden}
.al-v-top{position:absolute;display:flex;flex-direction:column;gap:6px}
.al-v-series{font-family:var(--anatomy-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--anatomy-muted)}
.al-v-title{font-weight:650;color:var(--anatomy-strong);letter-spacing:-.015em;line-height:1.1}
.al-v-hook{position:absolute;font-weight:700;color:var(--anatomy-strong);line-height:1.12;letter-spacing:-.02em;opacity:0}
.al-v-hook em{font-style:normal;color:var(--al-accent)}
.al-v-say{position:absolute;color:var(--anatomy-strong);line-height:1.3;font-weight:500}
.al-v-code{position:absolute;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-lo);overflow:hidden}
.al-v-code .al-code{line-height:1.55;overflow:hidden}
.al-v-code .al-line{padding:0 14px;border-left-width:4px}
.al-v-vars{position:absolute;font-family:var(--anatomy-mono);color:var(--anatomy-strong);display:flex;gap:28px}
.al-v-fast{position:absolute;font-family:var(--anatomy-mono);font-weight:600;color:var(--al-accent-ink);border:3px solid var(--al-accent);border-radius:999px;padding:.12em .7em .16em;opacity:0;letter-spacing:.02em}
.al-v-payoff{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;opacity:0;background:color-mix(in srgb,var(--anatomy-page) 86%,transparent)}
.al-v-payoff .big{font-family:var(--anatomy-mono);font-weight:700;color:var(--al-accent);line-height:1}
.al-v-payoff .row{color:var(--anatomy-strong);font-weight:600;line-height:1.25}
.al-v-payoff .row b{font-family:var(--anatomy-mono);color:var(--al-accent)}
.al-v-payoff .note{font-family:var(--anatomy-mono);color:var(--anatomy-muted)}
.al-v-payoff .ask{font-weight:700;color:var(--anatomy-strong);letter-spacing:-.02em;line-height:1.05}
.al-v-payoff .next{color:var(--anatomy-text);font-weight:500;margin-top:10px}
.al-cta{display:flex;gap:.6em;margin:6px 0 4px}
.al-chip{display:inline-flex;align-items:center;gap:.35em;padding:.28em .85em .3em;border-radius:999px;border:4px solid var(--al-accent);color:var(--anatomy-strong);font-weight:700;line-height:1;transform-origin:50% 50%}
.al-chip svg{width:.9em;height:.9em;fill:none;stroke:var(--al-accent);stroke-width:2.6}
.al-chip b{color:var(--al-accent);font-weight:800}
.al-chip[data-on]{background:var(--al-accent);color:#151515}
.al-chip[data-on] svg{fill:#151515;stroke:#151515}
.al-chip[data-on] b{color:#151515}
.al-v-handle{position:absolute;font-family:var(--anatomy-mono);color:var(--anatomy-muted);letter-spacing:.08em}
